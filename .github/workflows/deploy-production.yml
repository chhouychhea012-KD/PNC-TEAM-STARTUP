name: Build and deploy production

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_SITE_URL: https://pncteamstartup.site
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: static-site
          path: out/
          if-no-files-found: error

  deploy:
    name: Deploy to production
    needs: build
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: static-site
          path: out

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload and activate release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          RELEASE_ID: ${{ github.sha }}
        run: |
          release="/var/www/pncteamstartup.site/releases/$RELEASE_ID"

          ssh "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$release'"

          rsync -az --delete --chmod=D755,F644 \
            out/ "$DEPLOY_USER@$DEPLOY_HOST:$release/"

          ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "test -f '$release/index.html' && ln -sfn '$release' /var/www/pncteamstartup.site/current"

      - name: Verify production website
        run: |
          curl --fail --show-error --retry 5 --retry-delay 5 \
            https://pncteamstartup.site/